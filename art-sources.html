<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>チップ表示について — Apple Silicon</title><link rel="stylesheet" href="chip-art.css?v=3"><script src="chip-art.js?v=3"></script></head><body><main class="art-sources"><a href="./">Apple Silicon</a> · <a href="game.html">アリーナ</a> · <a href="2048.html">2048</a><h1>チップ表示について</h1><p>現在のチップ表示は外部の製品画像を読み込まず、サイト内で共通描画しています。Mシリーズ・Aシリーズ・ゲーム専用段階のすべてを、黒いチップ面に「M1」「M1 Pro」のようなモデル名を配置するデザインで統一しています。</p><p>この表示は比較やゲーム内でチップを識別しやすくするための簡略表現です。実物のパッケージ、ロゴ配置、刻印、寸法を正確に再現するものではありません。本サイトはApple非公式です。</p><div id="samples" style="display:flex;gap:14px;flex-wrap:wrap;margin-top:24px"></div></main><script>for(const name of ['M1','M1 Pro','M2 Max','M3 Ultra','M4','M5 Pro','M6','A18 Pro','A19 Pro']){const box=document.createElement('div');box.style.textAlign='center';box.style.fontSize='11px';box.append(ChipArt.element(name));const label=document.createElement('div');label.textContent=name;label.style.marginTop='6px';box.append(label);document.getElementById('samples').append(box);}</script></body></html>
